<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Landing Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        header {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #fff;
            padding: 80px 20px;
            text-align: center;
        }
        header h1 {
            margin: 0 0 10px;
            font-size: 2.5em;
        }
        header p {
            margin: 0 0 20px;
            font-size: 1.2em;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #fff;
            color: #2575fc;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .features {
            padding: 40px 20px;
            text-align: center;
        }
        .feature-item {
            margin: 20px 0;
        }
        footer {
            background: #f5f5f5;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Our Demo</h1>
        <p>Your solution starts here</p>
        <a href="#" class="btn">Get Started</a>
    </header>

    <section class="features">
        <div class="feature-item">
            <h2>Feature One</h2>
            <p>Simple description of the first feature.</p>
        </div>
        <div class="feature-item">
            <h2>Feature Two</h2>
            <p>Another short description goes here.</p>
        </div>
        <div class="feature-item">
            <h2>Feature Three</h2>
            <p>Highlight your best selling point.</p>
        </div>
    </section>

    <footer>
        &copy; 2025 Demo Company. All rights reserved.
    </footer>
</body>
</html>
